name: FastAPI Docker CI-CD

on:
  pull_request:
    branches:
      - main

  push:
    branches:
      - main

  workflow_dispatch:


jobs:

  # =====================================================
  # CI
  # =====================================================
  ci:
    name: CI - Test and Validate Docker
    runs-on: ubuntu-latest

    env:
      PYTHONPATH: ${{ github.workspace }}

    steps:

      # -------------------------------------------------
      # 1. Checkout
      # -------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v7


      # -------------------------------------------------
      # 2. Python
      # -------------------------------------------------
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"


      # -------------------------------------------------
      # 3. Dependencies
      # -------------------------------------------------
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest httpx


      # -------------------------------------------------
      # 4. Unit tests
      # -------------------------------------------------
      - name: Run tests
        run: |
          pytest -q


      # -------------------------------------------------
      # 5. Docker build
      # -------------------------------------------------
      - name: Build Docker image
        run: |
          docker build \
            -t rahul-chatbot:${{ github.sha }} \
            .


      # -------------------------------------------------
      # 6. Run container
      # -------------------------------------------------
      - name: Run Docker container
        run: |
          docker run -d \
            --name rahul-chatbot \
            -p 7860:7860 \
            rahul-chatbot:${{ github.sha }}


      # -------------------------------------------------
      # 7. Health check
      # -------------------------------------------------
      - name: Health check
        run: |
          echo "Waiting for application..."

          for i in {1..10}; do

            if curl --fail http://localhost:7860/health; then
              echo ""
              echo "Application is healthy"
              exit 0
            fi

            echo "Application not ready yet..."
            sleep 3

          done

          echo "Health check failed"

          docker logs rahul-chatbot

          exit 1


      # -------------------------------------------------
      # 8. Cleanup
      # -------------------------------------------------
      - name: Cleanup container
        if: always()
        run: |
          docker rm -f rahul-chatbot || true



  # =====================================================
  # CD
  # =====================================================
  cd:
    name: CD - Deploy to GCP Cloud Run

    needs: ci

    # Deploy only from main.
    # Supports:
    #   1. Merge/push to main
    #   2. Manual run from main
    if: >
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' ||
       github.event_name == 'workflow_dispatch')

    runs-on: ubuntu-latest

    # Required for Workload Identity Federation
    permissions:
      contents: read
      id-token: write


    # ---------------------------------------------------
    # GCP deployment configuration
    # ---------------------------------------------------
    env:
      PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}

      REGION: asia-south1

      ARTIFACT_REPO: llmops-docker

      SERVICE: rahul-chatbot

      APP_PORT: "7860"


    steps:

      # -------------------------------------------------
      # 1. Checkout
      # -------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v7


      # -------------------------------------------------
      # 2. Validate GitHub Secrets
      # -------------------------------------------------
      - name: Validate GCP configuration
        env:
          WIF_PROVIDER: ${{ secrets.GCP_WIF_PROVIDER }}
          DEPLOY_SA: ${{ secrets.GCP_DEPLOY_SA }}
        run: |

          if [ -z "$PROJECT_ID" ]; then
            echo "ERROR: GCP_PROJECT_ID secret is missing"
            exit 1
          fi

          if [ -z "$WIF_PROVIDER" ]; then
            echo "ERROR: GCP_WIF_PROVIDER secret is missing"
            exit 1
          fi

          if [ -z "$DEPLOY_SA" ]; then
            echo "ERROR: GCP_DEPLOY_SA secret is missing"
            exit 1
          fi

          echo "GCP deployment configuration found"


      # -------------------------------------------------
      # 3. Authenticate GitHub -> GCP
      # -------------------------------------------------
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}

          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}

          service_account: ${{ secrets.GCP_DEPLOY_SA }}


      # -------------------------------------------------
      # 4. Setup gcloud
      # -------------------------------------------------
      - name: Setup Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}


      # -------------------------------------------------
      # 5. Verify GCP authentication
      # -------------------------------------------------
      - name: Verify Google Cloud authentication
        run: |

          echo "Checking authenticated account..."

          gcloud auth list

          echo "Checking project..."

          gcloud config get-value project


      # -------------------------------------------------
      # 6. Define Docker image name
      # -------------------------------------------------
      - name: Define Docker image
        run: |

          IMAGE="${REGION}-docker.pkg.dev/${PROJECT_ID}/${ARTIFACT_REPO}/${SERVICE}:${GITHUB_SHA}"

          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"

          echo "Docker image configured"


      # -------------------------------------------------
      # 7. Build Docker image using Cloud Build
      #    and push to Artifact Registry
      # -------------------------------------------------
      - name: Build and push image
        run: |

          gcloud builds submit \
            --project "$PROJECT_ID" \
            --tag "$IMAGE" \
            .


      # -------------------------------------------------
      # 8. Deploy to Cloud Run
      # -------------------------------------------------
      - name: Deploy to Cloud Run
        run: |

          gcloud run deploy "$SERVICE" \
            --project "$PROJECT_ID" \
            --image "$IMAGE" \
            --region "$REGION" \
            --port "$APP_PORT" \
            --quiet


      # -------------------------------------------------
      # 9. Get production URL
      # -------------------------------------------------
      - name: Get Cloud Run URL
        run: |

          SERVICE_URL=$(gcloud run services describe "$SERVICE" \
            --project "$PROJECT_ID" \
            --region "$REGION" \
            --format="value(status.url)")

          echo "SERVICE_URL=$SERVICE_URL" >> "$GITHUB_ENV"

          echo "Cloud Run deployment completed"


      # -------------------------------------------------
      # 10. Production health check
      # -------------------------------------------------
      - name: Production health check
        run: |

          echo "Checking production application..."

          for i in {1..10}; do

            if curl --fail "$SERVICE_URL/health"; then
              echo ""
              echo "Production application is healthy"
              echo "Application URL: $SERVICE_URL"
              exit 0
            fi

            echo "Production application not ready yet..."
            sleep 5
            echo "Retrying..."

          done

          echo "Production health check failed"

          exit 1