name: FastAPI Docker CI-CD

on:
  pull_request:
    branches:
      - main

  push:
    branches:
      - main

  workflow_dispatch:

jobs:

  # =====================================================
  # CI
  # =====================================================
  ci:
    name: CI - Test and Validate Docker
    runs-on: ubuntu-latest

    env:
      PYTHONPATH: ${{ github.workspace }}

    steps:

      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest httpx

      - name: Run tests
        run: |
          pytest -q

      - name: Build Docker image
        run: |
          docker build -t rahul-chatbot:${{ github.sha }} .

      - name: Run Docker container
        run: |
          docker run -d \
            --name rahul-chatbot \
            -p 7860:7860 \
            rahul-chatbot:${{ github.sha }}

      - name: Health check
        run: |
          echo "Waiting for application..."

          for i in {1..10}; do
            if curl --fail http://localhost:7860/health; then
              echo "Application is healthy"
              exit 0
            fi

            echo "Application not ready yet..."
            sleep 3
          done

          echo "Health check failed"

          docker logs rahul-chatbot

          exit 1

      - name: Cleanup container
        if: always()
        run: |
          docker rm -f rahul-chatbot || true


  # =====================================================
  # CD
  # =====================================================
  cd:
    name: CD - Deploy to Hugging Face
    needs: ci

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Deploy to Hugging Face Space
        uses: huggingface/hub-sync@v0.1.0
        with:
          github_repo_id: ${{ github.repository }}
          huggingface_repo_id: YOUR_HF_USERNAME/rahul-chatbot
          hf_token: ${{ secrets.HF_TOKEN }}
          space_sdk: docker