name: FastAPI Docker CI-CD

on:
  pull_request:
    branches:
      - main

  push:
    branches:
      - main

  workflow_dispatch:

jobs:
  # =====================================================
  # CI
  # =====================================================
  ci:
    name: CI - Test and Validate Docker
    runs-on: ubuntu-latest

    env:
      PYTHONPATH: ${{ github.workspace }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest httpx

      - name: Run tests
        run: pytest -q

      - name: Build Docker image
        run: |
          docker build -t rahul-chatbot:${{ github.sha }} .

      - name: Run Docker container
        run: |
          docker run -d \
            --name rahul-chatbot \
            -p 7860:7860 \
            rahul-chatbot:${{ github.sha }}

      - name: Health check
        run: |
          echo "Waiting for application..."

          for i in {1..10}; do
            if curl --fail http://localhost:7860/health; then
              echo "Application is healthy"
              exit 0
            fi

            echo "Application not ready yet..."
            sleep 3
          done

          echo "Health check failed"
          docker logs rahul-chatbot
          exit 1

      - name: Cleanup container
        if: always()
        run: |
          docker rm -f rahul-chatbot || true

  # =====================================================
  # CD
  # =====================================================
  cd:
    name: CD - Deploy to GCP Cloud Run
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    env:
      PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      REGION: asia-south1
      ARTIFACT_REPO: llmops-docker
      SERVICE: rahul-chatbot

    steps:
      # --------------------------------------------
      # 1. Checkout source
      # --------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v7

      # --------------------------------------------
      # 2. Authenticate GitHub to GCP AWS
      # --------------------------------------------
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}

      # --------------------------------------------
      # 3. Install and configure gcloud
      # --------------------------------------------
      - name: Setup Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}

      # --------------------------------------------
      # 4. Define unique Docker image
      # --------------------------------------------
      - name: Define image
        run: |
          echo "IMAGE=${REGION}-docker.pkg.dev/${PROJECT_ID}/${ARTIFACT_REPO}/${SERVICE}:${GITHUB_SHA}" >> "$GITHUB_ENV"

      # --------------------------------------------
      # 5. Build and push to Artifact Registry
      # --------------------------------------------
      - name: Build and push image
        run: |
          gcloud builds submit \
            --tag "$IMAGE" \
            .

      # --------------------------------------------
      # 6. Deploy image to Cloud Run
      # --------------------------------------------
      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy "$SERVICE" \
            --image "$IMAGE" \
            --region "$REGION" \
            --port 7860 \
            --quiet

      # --------------------------------------------
      # 7. Get deployed URL
      # --------------------------------------------
      - name: Get Cloud Run URL
        run: |
          SERVICE_URL=$(gcloud run services describe "$SERVICE" \
            --region "$REGION" \
            --format="value(status.url)")

          echo "SERVICE_URL=$SERVICE_URL" >> "$GITHUB_ENV"
          echo "Application deployed to: $SERVICE_URL"

      # --------------------------------------------
      # 8. Production health check
      # --------------------------------------------
      - name: Production health check
        run: |
          curl --fail "$SERVICE_URL/health"