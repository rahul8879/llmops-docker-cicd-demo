name: FastAPI Docker CI-CD

# =========================================================
# WHEN SHOULD THIS PIPELINE RUN?
# =========================================================
on:

  # CI runs when a Pull Request is created/updated for main
  pull_request:
    branches:
      - main

  # CI + CD runs after code reaches main
  push:
    branches:
      - main

  # Optional: allows you to manually trigger from GitHub UI
  workflow_dispatch:


# =========================================================
# JOB 1: CONTINUOUS INTEGRATION
# =========================================================
jobs:

  ci:
    name: CI - Test, Build and Validate Container

    runs-on: ubuntu-latest

    steps:

      # ---------------------------------------------------
      # STEP 1: Get code from GitHub repository
      # ---------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v6


      # ---------------------------------------------------
      # STEP 2: Setup Python
      # ---------------------------------------------------
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"


      # ---------------------------------------------------
      # STEP 3: Install dependencies
      # ---------------------------------------------------
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest httpx


      # ---------------------------------------------------
      # STEP 4: Run unit tests
      # ---------------------------------------------------
      - name: Run tests
        run: |
          pytest -q


      # ---------------------------------------------------
      # STEP 5: Build Docker image
      # ---------------------------------------------------
      - name: Build Docker image
        run: |
          docker build \
            -t rahul-chatbot:${{ github.sha }} \
            .


      # ---------------------------------------------------
      # STEP 6: Run Docker container
      # ---------------------------------------------------
      - name: Start Docker container
        run: |
          docker run -d \
            --name rahul-chatbot \
            -p 7860:7860 \
            rahul-chatbot:${{ github.sha }}


      # ---------------------------------------------------
      # STEP 7: Check application is actually running
      # ---------------------------------------------------
      - name: Health check
        run: |
          echo "Waiting for application to start..."

          for i in {1..10}; do

            if curl --fail http://localhost:7860/health; then
              echo ""
              echo "Application is healthy!"
              exit 0
            fi

            echo "Application not ready yet..."
            sleep 3

          done

          echo "Health check failed."

          docker logs rahul-chatbot

          exit 1


      # ---------------------------------------------------
      # STEP 8: Show container logs
      # ---------------------------------------------------
      - name: Show Docker container
        run: |
          docker ps


      # ---------------------------------------------------
      # STEP 9: Cleanup
      # Runs even if previous step fails
      # ---------------------------------------------------
      - name: Cleanup container
        if: always()
        run: |
          docker rm -f rahul-chatbot || true



  # =======================================================
  # JOB 2: CONTINUOUS DEPLOYMENT
  # =======================================================

  cd:
    name: CD - Deploy to Hugging Face

    # CD will start ONLY if CI passes
    needs: ci

    # Deploy only when code is pushed/merged to main
    # PRs should NEVER deploy
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    runs-on: ubuntu-latest

    steps:

      # ---------------------------------------------------
      # STEP 1: Checkout validated code
      # ---------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v6


      # ---------------------------------------------------
      # STEP 2: Deploy/sync code to Hugging Face Space
      # ---------------------------------------------------
      - name: Deploy to Hugging Face Space
        uses: huggingface/hub-sync@v0.1.0

        with:
          github_repo_id: ${{ github.repository }}

          # CHANGE THIS
          huggingface_repo_id: YOUR_HF_USERNAME/rahul-chatbot

          hf_token: ${{ secrets.HF_TOKEN }}

          space_sdk: docker